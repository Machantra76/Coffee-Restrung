<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - ប្រព័ន្ធលក់</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; } </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4 py-3">
        <span class="navbar-brand fw-bold">ហាងកាហ្វេ POS System</span>
        <div class="text-white">
            <span id="userDisplay" class="me-3 fw-bold"></span>
            <button class="btn btn-danger btn-sm" onclick="logout()">ចាកចេញ</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="text-center">
            <h2 class="fw-bold text-success">ស្វាគមន៍មកកាន់ប្រព័ន្ធ POS!</h2>
            <p class="text-muted">ប្រព័ន្ធកំពុងដំណើរការតភ្ជាប់ជាមួយ Cloud Database ដោយសុវត្ថិភាព។</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userDisplay').innerText = `តួនាទី: ${user.role} (${user.full_name})`;
        });

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
