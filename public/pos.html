<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - ប្រព័ន្ធលក់ហាងកាហ្វេ និងភោជនីយដ្ឋាន</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        
        /* 🎨 Banner Header រចនាប័ទ្មថ្មី ដេញពណ៌បែប Luxury Gradient & Diamond Glow Effect */
        .pos-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #311b92 40%, #4a148c 70%, #1e293b 100%);
            color: #ffffff;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Effect ពន្លឺភ្លឺផ្លេកបែបគ្រាប់ពេជ្រ */
        .pos-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(255, 255, 255, 0) 60%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        .pos-header h4 {
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1;
        }

        /* ស្ទីល User Badge បែប Glassmorphism */
        .user-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            z-index: 1;
            display: inline-block;
        }

        .user-badge:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .product-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
        .product-img {
            height: 120px;
            object-fit: cover;
            background: #f1f5f9;
            width: 100%;
        }
        .cart-section {
            background: white;
            border-left: 1px solid #e2e8f0;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
        }
        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            max-height: calc(100vh - 320px);
        }
        .category-btn {
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header ថ្មីបែប Premium Gradient & Diamond Glow -->
    <div class="pos-header">
        <h4 class="m-0">
            <i class="fa-solid fa-mug-hot text-warning fs-3"></i> 
            <span>ហាងកាហ្វេ និងភោជនីយដ្ឋាន POS</span>
        </h4>
        <div>
            <span class="user-badge">
                <i class="fa-solid fa-gem text-warning me-1"></i> Cashier: Admin
            </span>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <!-- ផ្នែកខាងឆ្វេង៖ ម៉ឺនុយ និងផលិតផល -->
            <div class="col-lg-8 p-4">
                <!-- ជ្រើសរើសតុ -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">ជ្រើសរើសតុ (Table):</label>
                        <select class="form-select" id="tableSelect">
                            <option value="">-- ជ្រើសរើសតុ --</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <!-- Categories Buttons -->
                        <label class="form-label fw-bold d-block">ប្រភេទមុខទំនិញ:</label>
                        <div id="categoryContainer" class="d-flex gap-2 flex-wrap">
                            <button class="btn btn-outline-primary category-btn active" onclick="filterCategory('all')">ទាំងអស់</button>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- បញ្ជីផលិតផល -->
                <div class="row g-3" id="productContainer">
                    <div class="text-center text-muted py-5">កំពុងទាញយកម៉ឺនុយ...</div>
                </div>
            </div>

            <!-- ផ្នែកខាងស្តាំ៖ កន្ត្រកទំនិញ និងការបង់ប្រាក់ (Cart) -->
            <div class="col-lg-4 p-0">
                <div class="cart-section p-3 shadow-sm">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-cart-shopping me-2"></i> បញ្ជីកុម្ម៉ង់បច្ចុប្បន្ន (Current Order)</h5>
                    
                    <!-- Cart Items List -->
                    <div class="cart-items border rounded p-2 mb-3 bg-light" id="cartItemList">
                        <div class="text-center text-muted py-4">កន្ត្រកទំនិញទទេ (គ្មានទំនិញ)</div>
                    </div>

                    <!-- Summary Calculation -->
                    <div class="border-top pt-2 mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span>សរុបរង (Subtotal):</span>
                            <span id="subtotalAmount" class="fw-bold">0.00 $</span>
                        </div>
                        <div class="d-flex justify-content-between fs-5 fw-bold text-primary mb-3">
                            <span>ប្រាក់សរុប (Total):</span>
                            <span id="totalAmount">0.00 $</span>
                        </div>

                        <button class="btn btn-success w-100 py-3 fw-bold fs-5 shadow-sm" onclick="submitOrder()">
                            <i class="fa-solid fa-check-to-slot me-2"></i> បញ្ជូនបញ្ជាទិញ (Submit Order)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProducts = [];
        let cart = [];
        let tables = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadProducts();
            loadTables();
        });

        // 1. ទាញយក Categories
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const result = await res.json();
                if (result.success) {
                    const container = document.getElementById('categoryContainer');
                    result.data.forEach(cat => {
                        container.innerHTML += `<button class="btn btn-outline-primary category-btn" onclick="filterCategory(${cat.id})">${cat.name}</button>`;
                    });
                }
            } catch (err) { console.error(err); }
        }

        // 2. ទាញយក Products
        async function loadProducts(categoryId = 'all') {
            try {
                let url = '/api/products';
                if (categoryId !== 'all') url += `?category_id=${categoryId}`;
                
                const res = await fetch(url);
                const result = await res.json();
                if (result.success) {
                    allProducts = result.data;
                    renderProducts(allProducts);
                }
            } catch (err) { console.error(err); }
        }

        function renderProducts(products) {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';
            if (products.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5">ពុំមានទំនិញក្នុងប្រភេទនេះទេ</div>`;
                return;
            }
            products.forEach(p => {
                container.innerHTML += `
                    <div class="col-md-4">
                        <div class="product-card p-2" onclick='addToCart(${JSON.stringify(p)})'>
                            <img src="${p.image_url || 'https://via.placeholder.com/150'}" class="product-img rounded" alt="${p.name}">
                            <div class="p-2">
                                <h6 class="fw-bold mb-1 text-truncate">${p.name}</h6>
                                <p class="text-success fw-bold m-0">${parseFloat(p.price).toFixed(2)} $</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(catId) {
            loadProducts(catId);
        }

        // 3. ទាញយក Tables
        async function loadTables() {
            try {
                const res = await fetch('/api/tables');
                const result = await res.json();
                if (result.success) {
                    const select = document.getElementById('tableSelect');
                    result.data.forEach(t => {
                        select.innerHTML += `<option value="${t.id}">តុលេខ ${t.table_number} (ចំនួន ${t.capacity} នាក់)</option>`;
                    });
                }
            } catch (err) { console.error(err); }
        }

        // 4. Cart Logic
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1, notes: '' });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItemList');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-4">កន្ត្រកទំនិញទទេ</div>`;
                document.getElementById('subtotalAmount').innerText = '0.00 $';
                document.getElementById('totalAmount').innerText = '0.00 $';
                return;
            }

            cart.forEach((item, index) => {
                let subtotal = item.quantity * item.price;
                total += subtotal;
                container.innerHTML += `
                    <div class="d-flex justify-content-between align-items-center bg-white p-2 mb-2 rounded border shadow-sm">
                        <div>
                            <h6 class="m-0 fw-bold">${item.name}</h6>
                            <small class="text-muted">${item.price} $ x ${item.quantity}</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="fw-bold text-success">${subtotal.toFixed(2)} $</span>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${index})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('subtotalAmount').innerText = total.toFixed(2) + ' $';
            document.getElementById('totalAmount').innerText = total.toFixed(2) + ' $';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        // 5. Submit Order
        async function submitOrder() {
            const tableId = document.getElementById('tableSelect').value;
            if (!tableId) {
                alert('សូមជ្រើសរើសតុមុនពេលបញ្ជូន Order!');
                return;
            }
            if (cart.length === 0) {
                alert('សូមជ្រើសរើសមុខទំនិញយ៉ាងហោចណាស់មួយ!');
                return;
            }

            const payload = {
                table_id: parseInt(tableId),
                user_id: 1,
                order_type: 'dine_in',
                items: cart.map(i => ({
                    product_id: i.id,
                    quantity: i.quantity,
                    unit_price: parseFloat(i.price),
                    notes: i.notes || ''
                }))
            };

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert('បញ្ជាទិញ (Order) បានជោគជ័យ!');
                    cart = [];
                    renderCart();
                    document.getElementById('tableSelect').value = '';
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || 'សូមព្យាយាមម្តងទៀត'));
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងการតភ្ជាប់ទៅកាន់ Server!');
            }
        }
    </script>
</body>
</html>
