<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>គ្រប់គ្រងស្តុកទំនិញ | Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f1f5f9; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
        <span class="navbar-brand fw-bold fs-4"><i class="fa-solid fa-warehouse me-2"></i> តាមដានកម្រិតស្តុក (Inventory Tracking)</span>
        <div>
            <a href="pos.html" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ក្រោយ / Back</a>
            <button class="btn btn-danger btn-sm px-3 fw-bold" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i> ចាកចេញ</button>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card p-4 bg-white">
            <h4 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-boxes-stacked me-2"></i> បញ្ជីស្តុកទំនិញ និងវត្ថុធាតុដើម</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>#ID</th>
                            <th>ឈ្មោះទំនិញ / មុខទំនិញ</th>
                            <th>ប្រភេទ (Category)</th>
                            <th>តម្លៃលក់ ($)</th>
                            <th>ចំនួនក្នុងស្តុក (Stock Qty)</th>
                            <th>សកម្មភាព (Action)</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- Load dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            await loadInventory();
        });

        async function loadInventory() {
            try {
                const res = await fetch('/api/inventory');
                const result = await res.json();
                if (result.success) {
                    const tbody = document.getElementById('inventoryTableBody');
                    tbody.innerHTML = '';
                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">មិនទាន់មានទំនិញក្នុងស្តុកនៅឡើយទេ។</td></tr>`;
                        return;
                    }

                    result.data.forEach(item => {
                        const stockQty = item.stock_qty !== undefined ? item.stock_qty : 0;
                        let stockBadge = `<span class="badge bg-success">${stockQty} ឯកតា</span>`;
                        if (stockQty <= 5) {
                            stockBadge = `<span class="badge bg-danger">${stockQty} ឯកតា (ជិតអស់!)</span>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td>#${item.id}</td>
                                <td class="fw-bold">${item.name}</td>
                                <td><span class="badge bg-secondary">${item.category || 'General'}</span></td>
                                <td class="text-success fw-bold">$${Number(item.price).toFixed(2)}</td>
                                <td>${stockBadge}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick="updateStock(${item.id}, ${stockQty})">
                                        <i class="fa-solid fa-pen-to-square me-1"></i> កែប្រែស្តុក
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error('Error loading inventory:', err);
            }
        }

        async function updateStock(id, currentQty) {
            const newQty = prompt('បញ្ចូលចំនួនស្តុកថ្មី (Enter new stock quantity):', currentQty);
            if (newQty !== null && newQty.trim() !== '') {
                try {
                    const res = await fetch(`/api/inventory/${id}/stock`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stock_qty: newQty })
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('បានអាប់ដេតចំនួនស្តុកដោយជោគជ័យ!');
                        loadInventory();
                    } else {
                        alert('បរាជ័យក្នុងការអាប់ដេត: ' + result.error);
                    }
                } catch (err) {
                    console.error('Error updating stock:', err);
                }
            }
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentShift');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
