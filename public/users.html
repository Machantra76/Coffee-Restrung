<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - គ្រប់គ្រងគណនី</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f1f5f9; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
        <span class="navbar-brand fw-bold fs-4"><i class="fa-solid fa-users-gear me-2"></i> គ្រប់គ្រងគណនី | User Management</span>
        <div>
            <a href="pos.html" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ក្រោយ / Back</a>
            <button class="btn btn-danger btn-sm px-3 fw-bold" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i> ចាកចេញ</button>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <!-- Form បន្ថែម User ថ្មី -->
            <div class="col-md-4">
                <div class="card p-4 bg-white">
                    <h4 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-user-plus me-2"></i> បន្ថែមបុគ្គលិកថ្មី<br><small class="text-muted fs-6">Add New User</small></h4>
                    <form id="addUserForm" onsubmit="createUser(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">ឈ្មោះគណនី (Username)</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ពាក្យសម្ងាត់ (Password)</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ឈ្មោះពេញ (Full Name)</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">តួនាទី (Role)</label>
                            <select class="form-select" id="role">
                                <option value="Admin">Admin (ប្រធានហាង)</option>
                                <option value="Cashier">Cashier (អ្នកគិតលុយ)</option>
                                <option value="Kitchen">Kitchen (ផ្នែកផ្ទះបាយ)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                            <i class="fa-solid fa-save me-1"></i> រក្សាទុក / Save User
                        </button>
                    </form>
                </div>
            </div>

            <!-- តារាងបង្ហាញបញ្ជី User -->
            <div class="col-md-8">
                <div class="card p-4 bg-white">
                    <h4 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-list me-2"></i> បញ្ជីបុគ្គលិកទាំងអស់<br><small class="text-muted fs-6">Staff List</small></h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                ID
                                <tr>
                                    <th>#</th>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Role</th>
                                    <th>Created At</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <!-- ទិន្នន័យទាញពី Database នឹងត្រូវ Load មកទីនេះដោយស្វ័យប្រវត្តិ -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!user || user.role !== 'Admin') {
                alert('Unauthorized Access!');
                window.location.href = 'pos.html';
                return;
            }
            loadUsers();
        });

        // មុខងារទាញយកបញ្ជី User ពី Cloud API
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const result = await res.json();
                if (result.success) {
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';
                    result.data.forEach((u, index) => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${index + 1}</td>
                                <td class="fw-bold">${u.username}</td>
                                <td>${u.full_name}</td>
                                <td><span class="badge bg-secondary">${u.role}</span></td>
                                <td>${new Date(u.created_at).toLocaleString()}</td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error('Error loading users:', err);
            }
        }

        // មុខងារបង្កើត User ថ្មីបញ្ជូនទៅកាន់ Cloud API
        async function createUser(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('fullName').value;
            const role = document.getElementById('role').value;

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, full_name, role })
                });
                const result = await res.json();

                if (res.ok && result.success) {
                    alert('បង្កើត User បានដោយជោគជ័យ! / User created successfully!');
                    document.getElementById('addUserForm').reset();
                    loadUsers();
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || 'មិនអាចបង្កើតបានទេ'));
                }
            } catch (err) {
                console.error('Error creating user:', err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
