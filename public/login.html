<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ប្រព័ន្ធលក់ POS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #311b92 50%, #4a148c 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="login-card p-4">
        <div class="text-center mb-4">
            <i class="fa-solid fa-mug-hot fs-1 text-primary mb-2"></i>
            <h4 class="fw-bold">ចូលប្រព័ន្ធ POS</h4>
            <p class="text-muted small">សូមវាយបញ្ចូល Username និង Password របស់អ្នក</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="បញ្ចូល Username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="បញ្ចូល Password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Login ចូលប្រព័ន្ធ
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await res.json();

                if (res.ok && result.success) {
                    // រក្សាទុកព័ត៌មាន User ក្នុង LocalStorage
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    
                    // ផ្លាស់ប្តូរទៅកាន់ទំព័រ POS
                    window.location.href = 'pos.html';
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || 'មិនអាច Login បានទេ'));
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }
    </script>
</body>
</html>
