<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ប្រព័ន្ធ POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="fw-bold text-center mb-4 text-primary">ចូលប្រើប្រាស់ POS</h3>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold">Username:</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password:</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();
                
                if (res.ok && result.success) {
                    // រក្សាទុក session បណ្តោះអាសន្ន ឬរុញទៅ POS
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    window.location.href = 'pos.html';
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || ' thông tinមិនត្រឹមត្រូវ'));
                }
            } catch (err) {
                console.error(err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }
    </script>
</body>
</html>
