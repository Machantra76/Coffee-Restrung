<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>គ្រប់គ្រងមុខទំនិញ - Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f1f5f9; }
        .product-img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
        .image-preview-box { width: 100px; height: 100px; border: 2px dashed #cbd5e1; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; background-color: #f8fafc; }
        .image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3 py-2 shadow-sm">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center">
            <span class="navbar-brand fw-bold fs-6 fs-md-5">
                <i class="fa-solid fa-boxes-stacked me-2 text-warning"></i> គ្រប់គ្រងមុខទំនិញ / Product Management
            </span>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span id="userDisplay" class="text-white small fw-bold bg-secondary px-3 py-1 rounded-pill"></span>
                <a href="pos.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> ម៉ឺនុយមេ / Menu</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4 px-2 px-md-4">
        <div class="row g-4">
            
            <!-- Form ខាងឆ្វេង -->
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                    <h5 class="fw-bold text-dark mb-3" id="formTitle">
                        <i class="fa-solid fa-plus-circle me-1 text-primary"></i> បន្ថែមមុខទំនិញថ្មី / Add Product
                    </h5>

                    <form id="productForm" onsubmit="saveProduct(event)">
                        <input type="hidden" id="productId">
                        <input type="hidden" id="existingImageUrl">

                        <div class="mb-2">
                            <label class="form-label small fw-bold">លេខបាកូដ / Barcode (Optional)</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-barcode"></i></span>
                                <input type="text" id="productBarcode" class="form-control" placeholder="ស្កែន ឬវាយលេខបាកូដ">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">ឈ្មោះទំនិញ / Product Name (*)</label>
                            <input type="text" id="productName" class="form-control form-control-sm" placeholder="ឧ. កាហ្វេទឹកដោះគោ" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">តម្លៃលក់ ($) / Price (*)</label>
                                <input type="number" step="0.01" id="productPrice" class="form-control form-control-sm" placeholder="ឧ. 2.50" required>
                            </div>
                            <div class="col-6 mb-2">
                                <label class="form-label small fw-bold">តម្លៃទិញចូល ($) / Cost</label>
                                <input type="number" step="0.01" id="productCostPrice" class="form-control form-control-sm" placeholder="ឧ. 1.50">
                            </div>
                        </div>

                        <!-- ប្រភេទ / Category -->
                        <div class="mb-2">
                            <label class="form-label small fw-bold">ប្រភេទ / Category (*)</label>
                            <input type="text" id="productCategory" class="form-control form-control-sm" list="categoryList" placeholder="ឧ. Coffee, Food..." required>
                            <datalist id="categoryList">
                                <option value="Coffee">
                                <option value="Tea">
                                <option value="Beverage">
                                <option value="Food">
                                <option value="General">
                            </datalist>
                        </div>

                        <!-- ឯកតា / Unit -->
                        <div class="mb-2">
                            <label class="form-label small fw-bold">ឯកតា / Unit (*)</label>
                            <input type="text" id="productUnit" class="form-control form-control-sm" list="unitList" placeholder="រើស ឬវាយបញ្ចូល Unit ថ្មី" required>
                            <datalist id="unitList">
                                <option value="ដប">
                                <option value="កែវ">
                                <option value="ចាន">
                                <option value="កំប៉ុង">
                                <option value="កញ្ចប់">
                                <option value="កេស">
                            </datalist>
                        </div>

                        <!-- Upload Picture File (Base64) -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Upload Picture File (រូបភាព Base64)</label>
                            <input type="file" id="productImageFile" class="form-control form-control-sm mb-2" accept="image/*" onchange="previewFileImage(event)">
                            
                            <div class="d-flex align-items-center gap-3">
                                <div class="image-preview-box" id="previewContainer">
                                    <span class="text-muted small text-center p-1" id="previewPlaceholder"><i class="fa-solid fa-image d-block fs-4 mb-1"></i>គ្មានរូប</span>
                                    <img id="previewImg" src="" class="d-none" alt="Preview">
                                </div>
                                <span class="text-muted small">រូបភាពរក្សាទុកក្នុង Database ផ្ទាល់។</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm flex-grow-1 fw-bold py-2 shadow-sm">
                                <i class="fa-solid fa-floppy-disk me-1"></i> រក្សាទុក / Save
                            </button>
                            <button type="button" class="btn btn-light btn-sm fw-bold border" onclick="resetForm()">
                                បោះបង់ / Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- តារាងខាងស្តាំ -->
            <div class="col-12 col-md-7 col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold text-dark mb-0"><i class="fa-solid fa-list me-2 text-primary"></i> បញ្ជីទំនិញ / Product List</h5>
                        <button class="btn btn-outline-primary btn-sm fw-bold" onclick="loadProducts()">
                            <i class="fa-solid fa-rotate me-1"></i> Refresh
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr class="small">
                                    <th>រូបភាព</th>
                                    <th>បាកូដ</th>
                                    <th>ឈ្មោះទំនិញ</th>
                                    <th>ប្រភេទ</th>
                                    <th>ឯកតា</th>
                                    <th class="text-end">តម្លៃទិញ</th>
                                    <th class="text-end">តម្លៃលក់</th>
                                    <th class="text-end">សកម្មភាព</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <tr><td colspan="8" class="text-center text-muted py-4">កំពុងទាញយកទិន្នន័យ...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentUser = null;
        let productsList = [];
        let base64ImageString = ''; 

        document.addEventListener('DOMContentLoaded', () => {
            currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!currentUser || currentUser.role !== 'Admin') {
                alert('Unauthorized Access! សម្រាប់តែ Admin តែប៉ុណ្ណោះ។');
                window.location.href = 'pos.html';
                return;
            }
            document.getElementById('userDisplay').innerText = `Admin: ${currentUser.full_name}`;
            loadProducts();
        });

        function previewFileImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64ImageString = e.target.result; 
                    showPreview(base64ImageString);
                }
                reader.readAsDataURL(file);
            }
        }

        function showPreview(src) {
            const previewImg = document.getElementById('previewImg');
            const previewPlaceholder = document.getElementById('previewPlaceholder');
            previewImg.src = src;
            previewImg.classList.remove('d-none');
            previewPlaceholder.classList.add('d-none');
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const result = await res.json();

                if (result.success) {
                    productsList = result.data;
                    const tbody = document.getElementById('productsTableBody');
                    tbody.innerHTML = '';

                    if (productsList.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">មិនទាន់មានទំនិញក្នុង Database ទេ។</td></tr>`;
                        return;
                    }

                    updateCategoryAndUnitDatalists(productsList);

                    productsList.forEach(p => {
                        const imgTag = p.image_url 
                            ? `<img src="${p.image_url}" class="product-img-thumb shadow-sm" onerror="this.src='https://via.placeholder.com/50?text=No+Img'">`
                            : `<div class="product-img-thumb bg-light d-flex align-items-center justify-content-center text-secondary"><i class="fa-solid fa-image"></i></div>`;

                        tbody.innerHTML += `
                            <tr>
                                <td>${imgTag}</td>
                                <td class="small font-monospace text-muted">${p.barcode || '---'}</td>
                                <td class="fw-bold text-dark">${p.name}</td>
                                <td><span class="badge bg-light text-dark border">${p.category || 'General'}</span></td>
                                <td><span class="badge bg-secondary">${p.unit || 'ដប'}</span></td>
                                <td class="text-end text-muted">$${Number(p.cost_price || 0).toFixed(2)}</td>
                                <td class="text-end fw-bold text-success">$${Number(p.price).toFixed(2)}</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editProduct(${p.id})">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error('Error loading products:', err);
            }
        }

        function updateCategoryAndUnitDatalists(products) {
            const catDatalist = document.getElementById('categoryList');
            const unitDatalist = document.getElementById('unitList');
            
            const categories = new Set(['Coffee', 'Tea', 'Beverage', 'Food', 'General']);
            const units = new Set(['ដប', 'កែវ', 'ចាន', 'កំប៉ុង', 'កញ្ចប់', 'កេស']);
            
            products.forEach(p => {
                if (p.category && p.category.trim() !== '') categories.add(p.category.trim());
                if (p.unit && p.unit.trim() !== '') units.add(p.unit.trim());
            });

            catDatalist.innerHTML = '';
            categories.forEach(cat => { catDatalist.innerHTML += `<option value="${cat}">`; });

            unitDatalist.innerHTML = '';
            units.forEach(u => { unitDatalist.innerHTML += `<option value="${u}">`; });
        }

        async function saveProduct(e) {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            const existingImageUrl = document.getElementById('existingImageUrl').value;
            const finalImageUrl = base64ImageString || existingImageUrl;

            const productData = {
                barcode: document.getElementById('productBarcode').value,
                name: document.getElementById('productName').value,
                price: parseFloat(document.getElementById('productPrice').value) || 0,
                cost_price: parseFloat(document.getElementById('productCostPrice').value) || 0,
                category: document.getElementById('productCategory').value.trim() || 'General',
                unit: document.getElementById('productUnit').value.trim() || 'ដប',
                image_url: finalImageUrl
            };

            const method = id ? 'PUT' : 'POST';
            const endpoint = id ? `/api/products/${id}` : '/api/products';

            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                const result = await res.json();

                if (res.ok && result.success) {
                    alert(id ? 'កែប្រែទំនិញបានជោគជ័យ!' : 'បន្ថែមទំនិញថ្មីបានជោគជ័យ!');
                    resetForm();
                    loadProducts();
                } else {
                    alert('បរាជ័យ៖ ' + (result.error || 'Database error'));
                }
            } catch (err) {
                console.error('Save product error:', err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }

        function editProduct(id) {
            const product = productsList.find(p => p.id === id);
            if (!product) return;

            document.getElementById('productId').value = product.id;
            document.getElementById('productBarcode').value = product.barcode || '';
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productCostPrice').value = product.cost_price || 0;
            document.getElementById('productCategory').value = product.category || 'General';
            document.getElementById('productUnit').value = product.unit || 'ដប';
            document.getElementById('existingImageUrl').value = product.image_url || '';
            base64ImageString = product.image_url || ''; 

            if (product.image_url) {
                showPreview(product.image_url);
            } else {
                resetPreview();
            }

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square me-1 text-warning"></i> កែប្រែមុខទំនិញ / Edit Product`;
        }

        async function deleteProduct(id) {
            if (!confirm('តើអ្នកពិតជាចង់លុបមុខទំនិញនេះមែនទេ?')) return;

            try {
                const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                const result = await res.json();

                if (res.ok && result.success) {
                    alert('លុបទំនិញបានជោគជ័យ!');
                    loadProducts();
                } else {
                    alert('បរាជ័យក្នុងការលុប!');
                }
            } catch (err) {
                console.error('Delete product error:', err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('existingImageUrl').value = '';
            base64ImageString = '';
            resetPreview();
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-plus-circle me-1 text-primary"></i> បន្ថែមមុខទំនិញថ្មី / Add Product`;
        }

        function resetPreview() {
            document.getElementById('previewImg').classList.add('d-none');
            document.getElementById('previewPlaceholder').classList.remove('d-none');
        }
    </script>
</body>
</html>
