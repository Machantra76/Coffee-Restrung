<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ផ្នែកផ្ទះបាយ - Kitchen Display System & Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f1f5f9; }
        .order-card { border-radius: 12px; border: none; transition: all 0.3s ease; }
        .border-pending { border-left: 8px solid #ffc107 !important; }
        .border-preparing { border-left: 8px solid #0d6efd !important; }
        .summary-card { border-radius: 12px; border: none; }
        
        /* 🎨 ស្លាកសញ្ញាអក្សរក្រហមធំច្បាស់សម្រាប់មុខម្ហូបដែលកុម្ម៉ង់ថែម */
        .add-on-tag {
            color: #dc3545;
            background-color: #ffe6e6;
            border: 1.5px solid #dc3545;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3 py-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand fw-bold fs-5">
                <i class="fa-solid fa-utensils me-2 text-warning"></i> ផ្នែកផ្ទះបាយ / Kitchen Display System (KDS)
            </span>
            <div class="d-flex align-items-center gap-3">
                <span id="userDisplay" class="text-white small fw-bold bg-secondary px-3 py-1 rounded-pill"></span>
                <a href="pos.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> ម៉ឺនុយមេ / Menu</a>
                <button class="btn btn-danger btn-sm px-3 fw-bold" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i> ចាកចេញ</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4 px-3 px-md-4">
        
        <!-- 📊 ផ្នែករបាយការណ៍សង្ខេបផ្ទះបាយ -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card summary-card p-3 bg-warning text-dark shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold small d-block">ម្ហូបរង់ចាំធ្វើ (Pending Orders)</span>
                            <h2 class="fw-bold mb-0" id="reportPendingCount">0</h2>
                        </div>
                        <i class="fa-solid fa-hourglass-half fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card summary-card p-3 bg-primary text-white shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold small d-block">ម្ហូបកំពុងធ្វើ (Preparing)</span>
                            <h2 class="fw-bold mb-0" id="reportPreparingCount">0</h2>
                        </div>
                        <i class="fa-solid fa-fire-burner fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card summary-card p-3 bg-success text-white shadow-sm">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold small d-block">ម្ហូបធ្វើរួចរាល់សរុប (Completed Orders)</span>
                            <h2 class="fw-bold mb-0" id="reportCompletedCount">0</h2>
                        </div>
                        <i class="fa-solid fa-circle-check fs-1 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h3 class="fw-bold text-dark mb-0"><i class="fa-solid fa-bell me-2 text-primary"></i> បញ្ជីកុម្ម៉ង់មុខម្ហូបកំពុងរង់ចាំ</h3>
                <p class="text-muted small mb-0">ទិន្នន័យអាប់ដេតស្វ័យប្រវត្តិរៀងរាល់ ៥ វិនាទីម្តង</p>
            </div>
            <button class="btn btn-outline-primary btn-sm fw-bold" onclick="loadKitchenOrders()">
                <i class="fa-solid fa-rotate me-1"></i> អាប់ដេតភ្លាមៗ / Refresh
            </button>
        </div>

        <div class="row g-3 g-md-4" id="ordersGrid">
            <!-- Dynamic Kitchen Orders Grid -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            
            if (!currentUser || (currentUser.role !== 'Kitchen' && currentUser.role !== 'Admin')) {
                alert('Unauthorized Access! សម្រាប់តែផ្នែកផ្ទះបាយ និង Admin តែប៉ុណ្ណោះ។');
                window.location.href = 'pos.html';
                return;
            }

            document.getElementById('userDisplay').innerText = `${currentUser.role}: ${currentUser.full_name}`;

            loadKitchenOrders();
            setInterval(loadKitchenOrders, 5000); // Refresh រៀងរាល់ ៥ វិនាទី
        });

        async function loadKitchenOrders() {
            try {
                const res = await fetch('/api/orders/kitchen');
                const result = await res.json();
                
                if (result.success) {
                    const grid = document.getElementById('ordersGrid');
                    grid.innerHTML = '';

                    let pendingCount = 0;
                    let preparingCount = 0;

                    if (result.data.length === 0) {
                        grid.innerHTML = `
                            <div class="col-12 text-center py-5">
                                <i class="fa-solid fa-circle-check text-success display-1 mb-3"></i>
                                <h4 class="fw-bold text-muted">គ្មានបញ្ជាទិញម្ហូបអាហាររង់ចាំទេ!</h4>
                                <p class="text-muted small">រាល់មុខម្ហូបទាំងអស់ត្រូវបានរៀបចំរួចរាល់ហើយ</p>
                            </div>
                        `;
                        updateReportCards(0, 0);
                        return;
                    }

                    result.data.forEach(order => {
                        const status = order.status || 'Pending';
                        const isPreparing = status === 'Preparing';
                        
                        if (isPreparing) preparingCount++;
                        else pendingCount++;

                        const borderClass = isPreparing ? 'border-preparing' : 'border-pending';
                        const badgeClass = isPreparing ? 'bg-primary' : 'bg-warning text-dark';
                        const statusText = isPreparing ? 'កំពុងធ្វើ / Preparing' : 'រង់ចាំ / Pending';
                        const orderTime = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const tableNo = order.table_no || 'តុទូទៅ';

                        let itemsHtml = '<ul class="list-group list-group-flush small mb-3 bg-light rounded-3 overflow-hidden">';
                        if (order.items && order.items.length > 0) {
                            order.items.forEach(item => {
                                // 🟢 បង្កើតស្លាកសញ្ញាបន្ថែមថ្មី (Add-on Tag) ប្រសិនបើ item.added_qty > 0
                                let addOnBadge = '';
                                if (item.added_qty && item.added_qty > 0) {
                                    addOnBadge = `<div class="add-on-tag"><i class="fa-solid fa-circle-plus me-1"></i> កុម្ម៉ង់ថែមថ្មី: x${item.added_qty}</div>`;
                                }

                                itemsHtml += `
                                    <li class="list-group-item py-2 bg-transparent border-bottom">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="fw-bold text-dark fs-6"><i class="fa-solid fa-utensils me-1 text-secondary"></i> ${item.name}</span>
                                            <span class="badge bg-danger rounded-pill px-2.5 py-1.5 fs-6">សរុប x${item.quantity}</span>
                                        </div>
                                        ${addOnBadge}
                                    </li>
                                `;
                            });
                        }
                        itemsHtml += '</ul>';

                        grid.innerHTML += `
                            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                                <div class="card order-card shadow-sm p-3 bg-white ${borderClass} h-100 d-flex flex-column justify-content-between">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h5 class="fw-bold text-dark mb-0">Order #${order.id}</h5>
                                            <span class="badge ${badgeClass} px-2 py-1">${statusText}</span>
                                        </div>
                                        <div class="mb-2">
                                            <span class="badge bg-info text-dark fs-6 px-3 py-1 w-100"><i class="fa-solid fa-chair me-1"></i> ${tableNo}</span>
                                        </div>
                                        <div class="small text-muted mb-2">
                                            <i class="fa-solid fa-clock me-1"></i> ម៉ោង៖ <b>${orderTime}</b><br>
                                            <i class="fa-solid fa-user me-1"></i> Cashier: <b>${order.cashier_name || 'N/A'}</b>
                                        </div>
                                        <hr class="my-2">
                                        
                                        <div class="mb-2">
                                            <span class="fw-bold text-secondary small mb-1 d-block">មុខម្ហូបត្រូវធ្វើ៖</span>
                                            ${itemsHtml}
                                        </div>
                                    </div>

                                    <div>
                                        ${!isPreparing ? `
                                            <button class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-2" onclick="updateOrderStatus(${order.id}, 'Preparing', '${tableNo}')">
                                                <i class="fa-solid fa-fire me-1"></i> ចាប់ផ្តើមធ្វើ / Start Preparing
                                            </button>
                                        ` : `
                                            <button class="btn btn-success w-100 fw-bold py-2 shadow-sm" onclick="updateOrderStatus(${order.id}, 'Completed', '${tableNo}')">
                                                <i class="fa-solid fa-circle-check me-1"></i> ធ្វើរួចរាល់ (ជូនដំណឹង Sales)
                                            </button>
                                        `}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    updateReportCards(pendingCount, preparingCount);
                }
            } catch (err) {
                console.error('Error loading kitchen orders:', err);
            }
        }

        function updateReportCards(pending, preparing) {
            document.getElementById('reportPendingCount').innerText = pending;
            document.getElementById('reportPreparingCount').innerText = preparing;
            
            const completedCount = localStorage.getItem('kitchen_completed_count') || 0;
            document.getElementById('reportCompletedCount').innerText = completedCount;
        }

        async function updateOrderStatus(orderId, newStatus, tableNo) {
            try {
                const res = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const result = await res.json();
                if (result.success) {
                    if (newStatus === 'Completed') {
                        alert(`✅ បានធ្វើរួចរាល់សម្រាប់ ${tableNo}! ប្រព័ន្ធបានផ្ញើព័ត៌មានទៅផ្នែក Sales/រត់តុ រួចរាល់។`);
                        
                        let count = parseInt(localStorage.getItem('kitchen_completed_count') || 0);
                        localStorage.setItem('kitchen_completed_count', count + 1);
                    }
                    loadKitchenOrders();
                } else {
                    alert('បរាជ័យក្នុងការប្តូរស្ថានភាព Order!');
                }
            } catch (err) {
                console.error('Error updating status:', err);
                alert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!');
            }
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
