<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងផ្ទះបាយ (Kitchen Display System)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Preahvihear&family=Battambang:wght@400;700&display=swap');
        body { font-family: 'Battambang', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Navbar ផ្ទះបាយ -->
    <header class="bg-gray-800 shadow-md p-4 flex justify-between items-center border-b border-gray-700">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-utensils text-2xl text-orange-400"></i>
            <h1 class="text-xl font-bold">ប្រព័ន្ធបញ្ជាម្ហូបក្នុងផ្ទះបាយ (Kitchen Orders)</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="loadKitchenOrders()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded text-sm transition flex items-center space-x-1">
                <i class="fa-solid fa-rotate-right"></i> <span>ផ្ទុកទិន្នន័យឡើងវិញ</span>
            </button>
            <a href="/login.html" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm transition">ចាកចេញ</a>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="flex-1 p-6">
        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-orange-300 flex items-center">
                <i class="fa-solid fa-fire-burner mr-2"></i> បញ្ជីម្ហូបរង់ចាំធ្វើ និងកំពុងធ្វើ
            </h2>
            <span class="text-xs bg-gray-800 text-gray-300 px-3 py-1 rounded-full border border-gray-700">
                Auto-refresh រៀងរាល់ 3 វិនាទី
            </span>
        </div>

        <!-- Grid សម្រាប់បង្ហាញកាត Order របស់តុនីមួយៗ -->
        <div id="kitchen-orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center text-gray-500 py-12">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p>កំពុងទាញយកបញ្ជីបញ្ជាម្ហូប...</p>
            </div>
        </div>
    </main>

    <!-- JavaScript Script Logic -->
    <script>
        // 1. ទាញយកបញ្ជី Order សម្រាប់ផ្ទះបាយ
        async function loadKitchenOrders() {
            try {
                const response = await fetch('/api/orders/kitchen');
                const result = await response.json();

                if (result.success) {
                    renderKitchenOrders(result.data);
                }
            } catch (err) {
                console.error('Error loading kitchen orders:', err);
            }
        }

        // 2. បង្ហាញ Order ចូលទៅក្នុងកាត UI នីមួយៗ
        function renderKitchenOrders(orders) {
            const container = document.getElementById('kitchen-orders-container');
            container.innerHTML = '';

            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center text-gray-500 py-16 bg-gray-800/50 rounded-xl border border-gray-800">
                        <i class="fa-solid fa-circle-check text-4xl text-green-500 mb-3"></i>
                        <p class="text-lg">គ្មានម្ហូបរង់ចាំทำក្នុងពេលនេះទេ!</p>
                    </div>
                `;
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = `bg-gray-800 rounded-xl p-5 shadow-lg border ${
                    order.status === 'Preparing' ? 'border-yellow-500/50' : 'border-gray-700'
                } flex flex-col justify-between`;

                // កំណត់ពណ៌ Badge តាម Status
                let statusBadge = `<span class="px-2.5 py-1 text-xs font-semibold rounded bg-yellow-900/50 text-yellow-300 border border-yellow-700">Pending</span>`;
                if (order.status === 'Preparing') {
                    statusBadge = `<span class="px-2.5 py-1 text-xs font-semibold rounded bg-blue-900/50 text-blue-300 border border-blue-700">กำลังทำ (Preparing)</span>`;
                }

                // បញ្ជីមុខម្ហូបក្នុង Order នេះ
                let itemsHtml = '';
                if (order.items && order.items.length > 0) {
                    order.items.forEach(item => {
                        itemsHtml += `
                            <li class="flex justify-between items-center py-2 border-b border-gray-700/60 last:border-none">
                                <span class="font-medium text-gray-200 text-base">${item.name}</span>
                                <span class="bg-orange-500/20 text-orange-300 px-3 py-0.5 rounded-full font-bold text-sm">x${item.quantity}</span>
                            </li>
                        `;
                    });
                } else {
                    itemsHtml = `<li class="text-gray-500 py-2">គ្មានមុខទំនិញប្រភេទម្ហូបទេ</li>`;
                }

                card.innerHTML = `
                    <div>
                        <!-- Header របស់កាតតុ -->
                        <div class="flex justify-between items-center pb-3 border-b border-gray-700 mb-3">
                            <div>
                                <h3 class="text-lg font-bold text-white flex items-center">
                                    <i class="fa-solid fa-chair text-orange-400 mr-2"></i> តុទី: ${order.table_no}
                                </h3>
                                <p class="text-xs text-gray-400 mt-0.5">ម៉ោងកុម្ម៉ង់: ${new Date(order.created_at).toLocaleTimeString()}</p>
                            </div>
                            <div>${statusBadge}</div>
                        </div>

                        <!-- មុខម្ហូប -->
                        <ul class="mb-4 space-y-1">
                            ${itemsHtml}
                        </ul>
                    </div>

                    <!-- ប៊ូតុងបញ្ជា Status របស់ចុងភៅ -->
                    <div class="grid grid-cols-2 gap-2 pt-3 border-t border-gray-700">
                        <button onclick="updateOrderStatus(${order.id}, 'Preparing')" 
                            class="bg-yellow-600 hover:bg-yellow-700 text-white py-2 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-fire"></i> <span>ធ្វើម្ហូប</span>
                        </button>
                        <button onclick="updateOrderStatus(${order.id}, 'Completed')" 
                            class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-sm font-semibold transition flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-check"></i> <span>រួចរាល់</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. បច្ចុប្បន្នភាព Status ទៅកាន់ Server (Pending -> Preparing -> Completed)
        async function updateOrderStatus(orderId, newStatus) {
            try {
                const response = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.JSON.stringify ? JSON.stringify({ status: newStatus }) : JSON.stringify({ status: newStatus })
                });

                const result = await response.json();
                if (result.success) {
                    loadKitchenOrders(); // ផ្ទុកទិន្នន័យឡើងវិញភ្លាមៗបន្ទាប់ពីប្ដូរ Status
                } else {
                    alert('កំហុស៖ ' + (result.error || 'មិនអាចកែប្រែស្ថានភាពបានទេ'));
                }
            } catch (err) {
                console.error('Update status error:', err);
                alert('មានបញ្ហាក្នុងការទាក់ទងទៅកាន់ Server');
            }
        }

        // Auto Refresh ជារៀងរាល់ 3 វិនាទី
        setInterval(loadKitchenOrders, 3000);
        window.onload = loadKitchenOrders;
    </script>
</body>
</html>
