<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការលក់ និងតុសកម្ម (POS Cashier & Sales)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Preahvihear&family=Battambang:wght@400;700&display=swap');
        body { font-family: 'Battambang', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-cash-register text-2xl"></i>
            <h1 class="text-xl font-bold">ប្រព័ន្ធគ្រប់គ្រងការលក់ (POS Sales Dashboard)</h1>
        </div>
        <div>
            <span id="cashier-name-display" class="mr-4 text-sm bg-blue-700 px-3 py-1 rounded-full">Cashier</span>
            <a href="/login.html" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm transition">ចាកចេញ (Logout)</a>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- ផ្នែកខាងឆ្វេង៖ បញ្ជីតុសកម្ម (Active Tables) -->
        <section class="lg:col-span-1 bg-white p-5 rounded-xl shadow-md flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h2 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="fa-solid fa-chair text-blue-500 mr-2"></i> តុសកម្ម (Active Tables)
                </h2>
                <button onclick="loadActiveTables()" class="text-sm bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded transition">
                    <i class="fa-solid fa-rotate-right"></i> ផ្ទុកទិន្នន័យ
                </button>
            </div>

            <!-- Container សម្រាប់បង្ហាញតុ -->
            <div id="active-tables-container" class="space-y-3 overflow-y-auto flex-1 max-h-[600px] pr-1">
                <p class="text-gray-400 text-center py-8">កំពុងទាញយកទិន្នន័យតុ...</p>
            </div>
        </section>

        <!-- ផ្នែកខាងស្តាំ៖ ព័ត៌មានលម្អិតវិក្កយបត្រ និងបង់ប្រាក់ (Checkout Panel) -->
        <section class="lg:col-span-2 bg-white p-5 rounded-xl shadow-md flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center">
                        <i class="fa-solid fa-file-invoice-dollar text-green-500 mr-2"></i> ព័ត៌មានលម្អិតវិក្កយបត្រតុ
                    </h2>
                    <span id="selected-table-label" class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">សូមជ្រើសរើសតុខាងឆ្វេង</span>
                </div>

                <!-- មុខទំនិញក្នុងតុដែលបានរើស -->
                <div class="overflow-x-auto max-h-[350px] overflow-y-auto mb-4">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-2">មុខទំនិញ</th>
                                <th class="p-2 text-center">ចំនួន</th>
                                <th class="p-2 text-right">តម្លៃរាយ</th>
                                <th class="p-2 text-right">សរុប</th>
                            </tr>
                        </thead>
                        <tbody id="order-items-table-body" class="text-sm divide-y">
                            <tr>
                                <td colspan="4" class="text-center text-gray-400 py-8">ពុំទាន់មានតុត្រូវបានជ្រើសរើសនៅឡើយទេ</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- សរុបទឹកប្រាក់ និងប៊ូតុងបង់ប្រាក់ Checkout -->
            <div class="border-t pt-4 bg-gray-50 p-4 rounded-lg">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-base font-bold text-gray-700">ទឹកប្រាក់សរុบ (Grand Total):</span>
                    <span id="grand-total-display" class="text-2xl font-bold text-blue-600">$0.00</span>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <button onclick="processCheckout('Cash')" id="btn-pay-cash" disabled class="bg-green-600 hover:bg-green-700 disabled:bg-gray-300 text-white py-3 rounded-lg font-semibold transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-money-bill-wave"></i> <span>គិតលុយ (សាច់ប្រាក់)</span>
                    </button>
                    <button onclick="processCheckout('KHQR')" id="btn-pay-khqr" disabled class="bg-purple-600 hover:bg-purple-700 disabled:bg-gray-300 text-white py-3 rounded-lg font-semibold transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-qrcode"></i> <span>គិតលុយ (KHQR)</span>
                    </button>
                    <button onclick="deleteActiveOrder()" id="btn-cancel-order" disabled class="bg-red-500 hover:bg-red-600 disabled:bg-gray-300 text-white py-3 rounded-lg font-semibold transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-trash-can"></i> <span>លុបវិក្កយបត្រ</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Script Logic -->
    <script>
        let currentSelectedOrderId = null;
        let currentOrderTotal = 0;

        // 1. ទាញយកបញ្ជី Active Tables ជារៀងរាល់ 3 វិនាទី ឬពេលហៅ
        async function loadActiveTables() {
            try {
                const response = await fetch('/api/orders/active-tables');
                const result = await response.json();
                
                if (result.success) {
                    renderActiveTables(result.data);
                }
            } catch (err) {
                console.error('Error loading active tables:', err);
            }
        }

        // 2. បង្ហាញតុ Active ចូលទៅក្នុង UI ខាងឆ្វេង
        function renderActiveTables(tables) {
            const container = document.getElementById('active-tables-container');
            container.innerHTML = '';

            if (tables.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-8">គ្មានតុសកម្មក្នុងប្រព័ន្ធទេបច្ចុប្បន្ន</p>`;
                return;
            }

            tables.forEach(table => {
                const isSelected = currentSelectedOrderId === table.id;
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border transition cursor-pointer shadow-sm flex justify-between items-center ${
                    isSelected ? 'bg-blue-50 border-blue-500 ring-2 ring-blue-200' : 'bg-white hover:bg-gray-50 border-gray-200'
                }`;
                
                card.onclick = () => selectTableOrder(table.id, table.table_no, table.total_amount);

                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-gray-800 text-base">តុទី: ${table.table_no}</h3>
                        <p class="text-xs text-gray-500 mt-1">ម៉ោង: ${new Date(table.created_at).toLocaleTimeString()}</p>
                        <span class="inline-block mt-1.5 px-2 py-0.5 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">
                            ស្ថានភាព: ${table.status}
                        </span>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-bold text-blue-600">$${Number(table.total_amount).toFixed(2)}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. ពេលចុចជ្រើសរើសតុណាមួយ ដើម្បីមើលមុខទំនិញលម្អិត
        async function selectTableOrder(orderId, tableNo, totalAmount) {
            currentSelectedOrderId = orderId;
            currentOrderTotal = totalAmount;

            document.getElementById('selected-table-label').innerText = `តុទី: ${tableNo} (Order ID: #${orderId})`;
            document.getElementById('grand-total-display').innerText = `$${Number(totalAmount).toFixed(2)}`;

            // បើកដំណើរការប៊ូតុងបង់ប្រាក់ និងលុប
            document.getElementById('btn-pay-cash').removeAttribute('disabled');
            document.getElementById('btn-pay-khqr').removeAttribute('disabled');
            document.getElementById('btn-cancel-order').removeAttribute('disabled');

            // ទាញយកមុខទំនិញលម្អិតរបស់ Order នេះ
            try {
                const response = await fetch(`/api/orders/${orderId}/items`);
                const result = await response.json();
                
                if (result.success) {
                    renderOrderItems(result.items);
                }
            } catch (err) {
                console.error('Error loading order items:', err);
            }

            loadActiveTables(); // Refresh active list to highlight selection
        }

        // 4. បង្ហាញមុខទំនិញក្នុងតារាងវិក្កយបត្រ
        function renderOrderItems(items) {
            const tbody = document.getElementById('order-items-table-body');
            tbody.innerHTML = '';

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-4">គ្មានទំនិញក្នុងវិក្កយបត្រនេះទេ</td></tr>`;
                return;
            }

            items.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-2 font-medium text-gray-800">${item.name}</td>
                    <td class="p-2 text-center">${item.quantity}</td>
                    <td class="p-2 text-right">$${Number(item.price).toFixed(2)}</td>
                    <td class="p-2 text-right font-semibold text-gray-700">$${(item.quantity * item.price).toFixed(2)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // 5. ដំណើរការបង់ប្រាក់ Checkout (ធ្វើឱ្យតុបាត់ពី Active Tables ស្វ័យប្រវត្តិ)
        async function processCheckout(method) {
            if (!currentSelectedOrderId) return;

            if (!confirm(`តើអ្នកពិតជាចង់បញ្ចប់ការទូទាត់ប្រាក់តាមរយៈ ${method} សម្រាប់តុនេះមែនទេ?`)) return;

            try {
                const response = await fetch(`/api/orders/${currentSelectedOrderId}/pay`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payment_method: method, total_amount: currentOrderTotal })
                });

                const result = await response.json();
                if (result.success) {
                    alert('បង់ប្រាក់ និង Checkout ជោគជ័យ!');
                    resetCheckoutPanel();
                    loadActiveTables(); // តុនឹងបាត់ចេញពី Active Tables ស្វ័យប្រវត្តិនៅទីនេះ
                } else {
                    alert('កំហុស៖ ' + result.error);
                }
            } catch (err) {
                console.error('Checkout Error:', err);
                serverError('មានបញ្ហាក្នុងការទាក់ទងទៅកាន់ Server');
            }
        }

        // 6. លុបវិក្កយបត្រ និងបូកស្តុកសងវិញ
        async function deleteActiveOrder() {
            if (!currentSelectedOrderId) return;

            if (!confirm('តើអ្នកពិតជាចង់លុបវិក្កយបត្រនេះ និងបូកស្តុកទំនិញសងវិញមែនទេ?')) return;

            try {
                const response = await fetch(`/api/orders/${currentSelectedOrderId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    alert('បានលុបវិក្កយបត្រដោយជោគជ័យ!');
                    resetCheckoutPanel();
                    loadActiveTables();
                } else {
                    alert('កំហុស៖ ' + result.error);
                }
            } catch (err) {
                console.error('Delete Order Error:', err);
            }
        }

        function resetCheckoutPanel() {
            currentSelectedOrderId = null;
            currentOrderTotal = 0;
            document.getElementById('selected-table-label').innerText = 'សូមជ្រើសរើសតុខាងឆ្វេង';
            document.getElementById('grand-total-display').innerText = '$0.00';
            document.getElementById('order-items-table-body').innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-8">ពុំទាន់មានតុត្រូវបានជ្រើសរើសនៅឡើយទេ</td></tr>`;
            document.getElementById('btn-pay-cash').setAttribute('disabled', 'true');
            document.getElementById('btn-pay-khqr').setAttribute('disabled', 'true');
            document.getElementById('btn-cancel-order').setAttribute('disabled', 'true');
        }

        // Auto Refresh Active Tables ជារៀងរាល់ 3 វិនាទី
        setInterval(loadActiveTables, 3000);
        window.onload = loadActiveTables;
    </script>
</body>
</html>
